name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the information below.
        If this is a security vulnerability, please follow the [security policy](https://github.com/tguidoux/opensqs/blob/main/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start the server with `bazel run //apps/go/server:opensqs-server`
        2. Create a queue: `aws sqs create-queue --queue-name my-queue`
        3. Send a message: `aws sqs send-message ...`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, logs, or stack traces.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (bazel run)
        - Docker
        - Kubernetes (Helm)
        - Other
    validations:
      required: true

  - type: input
    id: opensqs-version
    attributes:
      label: OpenSQS Version
      placeholder: "e.g., v0.0.7"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "e.g., 1.25.5"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., macOS 15.2, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `config.yaml` (redact any secrets).
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any relevant log output (redact any sensitive data).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/tguidoux/opensqs/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
