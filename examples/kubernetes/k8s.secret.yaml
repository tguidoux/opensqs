# Kubernetes Secret — OpenSQS credentials and server secret
#
# Purpose:
#   Stores the server secret (for receipt handle signing) and the initial
#   credential pair (access key / secret key) as Kubernetes Secrets.
#   These are referenced by k8s.with-creds.yaml via secretKeyRef.
#
# IMPORTANT: The values below are base64-encoded example credentials.
# Replace them with your own in any real deployment.
#
# To encode your own values:
#   echo -n 'your-secret-here' | base64
#
# Usage:
#   kubectl apply -f examples/kubernetes/k8s.secret.yaml
#
# See: examples/kubernetes/README.md

---
apiVersion: v1
kind: Namespace
metadata:
  name: opensqs
  labels:
    app.kubernetes.io/name: opensqs

---
apiVersion: v1
kind: Secret
metadata:
  name: opensqs-secrets
  namespace: opensqs
  labels:
    app.kubernetes.io/name: opensqs
type: Opaque
stringData:
  # Server secret for HMAC receipt handle signing
  # Replace with a strong random value in production
  serverSecret: "change-me-to-a-strong-secret"

  # Initial credential — label
  credLabel: "k8s-access-key"

  # Initial credential — AWS-style access key ID
  # These are AWS documentation example values — replace with your own
  accessKeyId: "AKIAIOSFODNN7EXAMPLE"

  # Initial credential — AWS-style secret access key
  secretAccessKey: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
