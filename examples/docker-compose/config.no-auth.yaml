# OpenSQS config for Docker Compose — no authentication
# Mounted into the container at /etc/opensqs/config.yaml

server:
  host: "0.0.0.0"
  port: 9324

sqs:
  nodeAddress: "localhost:9324"
  accountId: "123456789012"
  region: "us-east-1"
  storageType: "memory"
  strictLimits: true
  serverSecret: "dev-only-not-for-production"

log:
  level: "info"

ui:
  enabled: true
  port: 9325

metrics:
  enabled: true
  port: 9326

environment: "local"

auth:
  enabled: false

queues:
  autoCreate: true
